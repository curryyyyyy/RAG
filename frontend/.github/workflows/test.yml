name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    # E2E 依赖完整后端栈（MySQL/Redis/Elasticsearch/Kafka/MinIO），公共 runner 不提供，
    # 环境缺失时 job 会整体失败，故不阻塞 PR；接入自建 runner 或服务容器后可移除该开关。
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 8

      - uses: actions/setup-node@v4
        with:
          # e2e-tests 的 API 层使用原生 fetch/FormData，Node 18 无全局 File
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        # 指向外部已部署前端时无需本地构建
        if: ${{ !vars.E2E_BASE_URL }}
        run: cd frontend && pnpm install

      - name: Install e2e-tests dependencies
        run: cd e2e-tests && pnpm install

      - name: Run E2E tests
        run: |
          cd e2e-tests
          pnpm exec playwright install --with-deps chromium
          pnpm test
        env:
          CI: true
          TEST_USER: ${{ secrets.TEST_USER }}
          TEST_PASS: ${{ secrets.TEST_PASS }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e-tests/playwright-report/

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: e2e-tests/test-results/

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 8

      - uses: actions/setup-node@v4
        with:
          # vitest 4 要求 Node ^20 || >=22
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: cd frontend && pnpm install

      - name: Run unit tests
        run: cd frontend && pnpm test:unit

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: coverage
          path: frontend/coverage/
